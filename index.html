<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RWD 練習</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f4f9;
    }
    .box {
      width: 300px;
      height: 300px;
      background-color: #ff6b6b;
      border-radius: 0;
      transition: all 0.3s ease;
    }
    @media (min-width: 768px) {
      .box {
        background-color: #4ecdc4;
        border-radius: 40px;
      }
    }
    @media (min-width: 1024px) {
      .box {
        background-color: #ffe66d;
        border-radius: 50%;
      }
    }
  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
